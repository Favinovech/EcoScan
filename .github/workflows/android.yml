name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cachear dependencias de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      # No se genera app/google-services.json: el build está configurado para compilar
      # sin él (ver app/build.gradle.kts), así que CI ejercita el mismo camino que un
      # checkout nuevo sin Firebase configurado todavía.
      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Ejecutar pruebas unitarias
        run: ./gradlew test --stacktrace

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
